[project]
name = "youtube-automations"
version = "0.1.0"
description = "Plot Armor Facts: video engine (via REST) -> human review -> YouTube upload."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
