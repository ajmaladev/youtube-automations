name: Daily series slots

# Three times a day (UTC):
#   07:00 morning   -> plan interesting topic + generate Part 1
#   13:00 afternoon -> generate Part 2
#   20:00 night     -> generate Part 3
# Next calendar day starts a new series.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   PEXELS_API_KEY
#   GROQ_API_KEY
#   BASIC_AUTH_USER
#   BASIC_AUTH_PASSWORD
#   BASIC_AUTH_HASH          (bcrypt hash of the password, in single quotes in .env normally)
#   YOUTUBE_TOKEN_JSON       (contents of .credentials/youtube.token.json)
#   YOUTUBE_CLIENT_SECRETS_JSON  (contents of .credentials/client_secret.json)
# Optional:
#   ENGINE_API_KEY

on:
  schedule:
    - cron: "0 7 * * *"   # morning
    - cron: "0 13 * * *"  # afternoon
    - cron: "0 20 * * *"  # night
  workflow_dispatch:
    inputs:
      slot:
        description: "Which episode slot to run"
        required: true
        type: choice
        default: morning
        options: [morning, afternoon, night, auto]
      skip_upload:
        description: "Skip YouTube upload"
        required: false
        type: boolean
        default: false

concurrency:
  group: plot-armor-daily
  cancel-in-progress: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync

      - name: Vendor video engine + karaoke overrides + BGM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git
          make vendor

      - name: Write config and .env
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          BASIC_AUTH_HASH: ${{ secrets.BASIC_AUTH_HASH }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
        run: |
          set -euo pipefail
          cp config/config.template.toml config/config.toml
          mkdir -p .credentials output/pending output/approved output/uploaded
          # Escape single quotes for BASIC_AUTH_HASH shell safety
          HASH_ESCAPED=${BASIC_AUTH_HASH//\'/\'\\\'\'}
          cat > .env <<EOF
          PEXELS_API_KEY=${PEXELS_API_KEY}
          GROQ_API_KEY=${GROQ_API_KEY}
          STORY_LLM_PROVIDER=groq
          STORY_ALLOW_UNVERIFIED=false
          AUTO_SERIES=true
          DAILY_GENERATE_COUNT=1
          LLM_PROVIDER=ollama
          OLLAMA_HOST=http://127.0.0.1:9
          BASIC_AUTH_USER=${BASIC_AUTH_USER}
          BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
          BASIC_AUTH_HASH='${HASH_ESCAPED}'
          ENGINE_API_KEY=${ENGINE_API_KEY}
          ENGINE_BASE_URL=http://127.0.0.1:8080
          ENGINE_HOST_PORT=8080
          BIND_ADDR=127.0.0.1
          YOUTUBE_CLIENT_SECRETS_PATH=.credentials/client_secret.json
          EOF
          printf '%s' "$YOUTUBE_CLIENT_SECRETS_JSON" > .credentials/client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .credentials/youtube.token.json

      - name: Start video engine
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf -u "${{ secrets.BASIC_AUTH_USER }}:${{ secrets.BASIC_AUTH_PASSWORD }}" \
              http://127.0.0.1:8080/ping >/dev/null; then
              echo "engine ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Resolve slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then SLOT=morning
            elif [ "$HOUR" -lt 18 ]; then SLOT=afternoon
            else SLOT=night
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Running slot: $SLOT"

      - name: Generate + auto-approve + upload
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          GITHUB_ACTIONS: "true"
        run: |
          EXTRA=""
          if [ "${{ inputs.skip_upload }}" = "true" ]; then
            EXTRA="--skip-upload"
          fi
          uv run python -m orchestrator.scheduler \
            --slot "${{ steps.slot.outputs.slot }}" \
            --auto-approve \
            --verbose \
            $EXTRA

      - name: Persist series state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p topics/series output
          touch output/queue_state.json
          git add -f topics/history.json topics/series output/queue_state.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: persist series state after ${{ steps.slot.outputs.slot }} slot"
            git push
          fi

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: |
            output/pending/*.mp4
            output/approved/*.mp4
            output/uploaded/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop engine
        if: always()
        run: docker compose down -v || true
