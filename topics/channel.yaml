# Plot Armor Facts - automatic series settings (edit by hand).
#
# When topics/queue.yaml has no unfinished manual topics, the pipeline asks the
# story LLM (STORY_LLM_PROVIDER in .env) to plan a new multi-part series from
# these categories. Every planned series is recorded in topics/history.json and
# new ideas that are too similar to anything there are rejected.

channel_name: "Plot Armor Facts"
episodes_per_series: 3
words_per_episode: [90, 130]    # ~35-50 seconds of narration per part
ideas_per_round: 6              # ideas proposed before de-duplication
similarity_threshold: 0.55      # 0-1; lower = stricter about "same story"
avoid_recent: 100               # past series shown to the AI as "already covered"
min_verified_facts: 8           # ideas with fewer researched, sourced facts are dropped

audience: >-
  teens and adults who love surprising true stories — animals, nature, history,
  science, and comic-book legends — told in clear, simple English
tone: >-
  simple English, short sentences, curious and exciting — like a friend telling
  you an unbelievable true story. Avoid jargon. Prefer concrete images over
  abstract ideas.
description_footer: "Stock footage: Pexels. Music: royalty-free. Made with AI-assisted narration."

categories:
  - name: real-life-legends
    weight: 4
    brief: >-
      True stories from nature and history that sound unbelievable: famous animals,
      wild survival tales, ancient mysteries, explorers, and "wait, that really happened?"
      moments. Well-documented facts only. Example vibe: the story of a lion that
      changed a town, a whale that walked onto shore, a forgotten king, a bee that
      navigates by the sun.
  - name: comics-lore
    weight: 2
    brief: >-
      Marvel and DC history told simply: origins, legendary storylines, creator stories.
      Well-documented facts only. No spoilers of brand-new comics unless widely known.
  - name: superhero-science
    weight: 2
    brief: >-
      The real science behind superpowers and comic tech, explained in plain English:
      could it work, what would it take, and what real research comes closest.
