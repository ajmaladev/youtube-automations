# Plot Armor Facts - automatic series settings (edit by hand).
#
# When topics/queue.yaml has no unfinished manual topics, the pipeline asks the
# story LLM (STORY_LLM_PROVIDER in .env) to plan a new multi-part series from
# these categories. Every planned series is recorded in topics/history.json and
# new ideas that are too similar to anything there are rejected.

channel_name: "Plot Armor Facts"
episodes_per_series: 3
words_per_episode: [90, 130]    # ~35-50 seconds of narration per part
ideas_per_round: 6              # ideas proposed before de-duplication
similarity_threshold: 0.55      # 0-1; lower = stricter about "same story"
avoid_recent: 100               # past series shown to the AI as "already covered"
min_verified_facts: 8           # ideas with fewer researched, sourced facts are dropped

audience: "teens and adults who love true stories with a 'wait, really?' twist: survival, nature, history and science"
tone: "fast, punchy and curious - like a friend telling you an incredible story"
description_footer: "Stock footage: Pexels. Made with AI-assisted narration."

# Pick stories whose scenes exist as real stock footage (animals, oceans, mountains, storms, cities,
# planes, space), so the picture matches the narration. No Marvel or DC content.
categories:
  - name: nature
    weight: 3
    brief: >-
      Real animal and nature stories with a surprising twist, told through animals and places
      that are easy to film. Well-documented facts only.
  - name: adventure
    weight: 2
    brief: >-
      True survival, rescue and exploration stories: mountains, oceans, caves, flights and space.
  - name: history
    weight: 2
    brief: >-
      Unbelievable true events and people, including the real stories behind hit movies.
  - name: science
    weight: 1
    brief: >-
      Space, weather, volcanoes and discoveries explained through one gripping true story.
