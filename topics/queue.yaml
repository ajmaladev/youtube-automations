# Plot Armor Facts - topic queue (edit by hand).
#
# The pipeline never rewrites this file. Progress is tracked in
# output/queue_state.json (a topic with status "generated" is skipped; delete
# its entry there, or run `generate --topic <id>`, to regenerate it).
#
# Any key under `defaults` or a topic that is not a VideoRequest field
# (see orchestrator/models.py) is forwarded verbatim to the video engine's
# POST /api/v1/videos body, e.g. video_terms, video_clip_duration, font_size.
#
# Visuals are real-world stock footage (Pexels). Never add official Marvel/DC
# art, movie clips, comic panels or logos. Steer footage with `video_terms`.

defaults:
  video_aspect: "9:16" # "9:16" | "16:9" | "1:1"
  voice_name: "en-US-AndrewMultilingualNeural-Male" # free Edge TTS. Also: en-US-BrianMultilingualNeural-Male, en-US-AvaMultilingualNeural-Female
  video_language: "en"
  paragraph_number: 1
  video_script_prompt: "End the script with exactly this sentence: Subscribe to Plot Armor Facts for more videos."
  bgm_type: "" # no background music (bundled songs removed)
  privacy_status: private # private | unlisted  ("public" is refused)
  made_for_kids: false
  category_id: "27" # 27 = Education, 24 = Entertainment, 28 = Science & Tech
  tags: [shorts, plotarmorfacts]
  # Shorts karaoke captions: short phrase on screen, spoken word highlighted yellow
  subtitle_enabled: true
  subtitle_display_mode: karaoke          # sentence | word_by_word | karaoke
  subtitle_animation: none
  subtitle_position: custom               # lower-third like CapCut Shorts
  custom_position: 78                     # % from top (matches typical Shorts safe area)
  font_name: BeVietnamPro-Bold.ttf
  font_size: 72
  text_fore_color: "#FFFFFF"              # inactive words
  subtitle_highlight_color: "#FFFF00"     # active spoken word
  karaoke_words_per_line: 4               # short punchy phrases
  stroke_color: "#000000"
  stroke_width: 5.0

topics:
  # --- comics lore ---
  - id: batman-origin-facts
    subject: "5 lesser-known facts about Batman's comic book origin"
    video_terms: "night city skyline, rain alley, bat silhouette, gothic building, lightning storm"
    tags: [shorts, plotarmorfacts, dc, batman, comics]

  - id: venom-symbiote-history
    subject: "The history of the Venom symbiote in Marvel comics"
    video_terms: "black liquid, ink in water, dark city night, alien texture, rooftop at night"
    tags: [shorts, plotarmorfacts, marvel, venom, comics]

  # --- science behind the powers ---
  - id: superhero-landing-physics
    subject: "Could a human survive a superhero landing? The physics explained"
    video_terms: "person jumping, slow motion impact, city rooftop, concrete crack, parkour"
    tags: [shorts, plotarmorfacts, science, physics, superheroes]

  - id: spider-silk-vs-steel
    subject: "Is real spider silk stronger than steel?"
    video_terms: "spider web dew, spider macro, steel cable, laboratory, bridge cables"
    tags: [shorts, plotarmorfacts, science, spiders]

  # --- examples ---
  # - id: honeybee-sun-compass
  #   subject: "How honeybees use the sun as a compass"
  #   tags: [shorts, science, bees]

  - id: paused-example
    subject: "An example topic that is skipped"
    enabled: false
